  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #222;
    }
    #ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: env(safe-area-inset-top, 14px) 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .ui-pill {
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.35);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    #overlay h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: #ff4d4d;
      letter-spacing: 1px;
      text-shadow: 0 2px 0 #8b0000, 0 0 20px rgba(255,80,80,0.5);
      font-weight: 800;
    }
    #overlay p {
      font-size: 1.08rem;
      line-height: 1.55;
      max-width: 320px;
      margin-bottom: 24px;
      color: #f0f0f0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #overlay button {
      background: linear-gradient(180deg, #ff5555 0%, #cc2222 100%);
      color: #fff;
      border: 3px solid #fff;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 5px 0 #8b0000, 0 8px 20px rgba(0,0,0,0.45);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    #overlay button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8b0000, 0 4px 12px rgba(0,0,0,0.35);
    }
    .hidden { display: none !important; }
    #permission-note {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 16px;
      color: #ddd;
    }
  </style>

    const bgImg = new Image();
    let bgReady = false;
    bgImg.onload = () => { bgReady = true; };
    bgImg.src = BG_SRC;

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    let W, H, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // No orientation lock – works in both portrait and landscape

    let score = 0;
    let lives = 3;
    let level = 1;
    let levelCaught = 0;          // drips caught this level
    let levelGoal = 10;           // need this many to advance
    let running = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let spawnInterval = 2.0;      // start slow: every 2 seconds
    let tiltX = 0;
    let cup = null;
    let drips = [];
    let particles = [];
    let steam = [];
    const levelEl = document.getElementById('level');

    function createCup() {
      const size = Math.min(W, H) * 0.18;
      return {
        x: W / 2,
        y: H - size * 0.7 - 24,
        w: size,
        h: size * 0.7,
        vx: 0,
        targetX: W / 2
      };
    }

    function spawnDrip() {
      // Bigger drips
      const r = 11 + Math.random() * 8;
      drips.push({
        x: 24 + Math.random() * (W - 48),
        y: -30,
        r,
        vy: 70 + Math.random() * 50,   // slightly gentler start
        vx: (Math.random() - 0.5) * 30,
        color: Math.random() > 0.15 ? '#3d2314' : '#5c3a22'
      });
    }

    function spawnSplash(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 90;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 40,
          life: 0.4 + Math.random() * 0.4,
          maxLife: 0.8,
          r: 2 + Math.random() * 3,
          color
        });
      }
    }

    function spawnSteam() {
      if (!cup) return;
      steam.push({
        x: cup.x + (Math.random() - 0.5) * cup.w * 0.5,
        y: cup.y - 8,
        vy: -20 - Math.random() * 25,
        life: 0.8 + Math.random() * 0.6,
        maxLife: 1.4,
        r: 4 + Math.random() * 6
      });
    }

    let hasPermission = false;

    // Smoothed tilt – works in both portrait & landscape
    let rawTiltX = 0;
    let smoothTiltX = 0;

    function handleOrientation(e) {
      if (e.gamma == null && e.beta == null) return;

      const gamma = e.gamma || 0; // left/right when portrait
      const beta  = e.beta  || 0; // front/back when portrait; becomes left/right in landscape

      // Detect approximate orientation from window size (more reliable than screen.orientation on all browsers)
      const isLandscape = window.innerWidth > window.innerHeight;

      let v;
      if (isLandscape) {
        // In landscape the left/right tilt is mostly carried by beta
        // (sign depends on whether user rotated left or right – we normalize)
        v = beta / 40;
      } else {
        // Portrait: classic gamma
        v = gamma / 30;
      }

      rawTiltX = Math.max(-1, Math.min(1, v));
    }

    function handleMotion(e) {
      // Fallback using gravity vector – works across orientations
      if (!e.accelerationIncludingGravity) return;
      const ax = e.accelerationIncludingGravity.x || 0;
      const ay = e.accelerationIncludingGravity.y || 0;

      const isLandscape = window.innerWidth > window.innerHeight;
      let v;
      if (isLandscape) {
        // When landscape, y often becomes the left/right axis
        v = ay / 7;
      } else {
        v = -ax / 6;
      }
      rawTiltX = Math.max(-1, Math.min(1, v));
    }

    async function requestMotionPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            hasPermission = true;
          }
        } catch (err) {
          console.warn('Orientation permission denied', err);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        window.addEventListener('devicemotion', handleMotion);
        hasPermission = true;
      }

      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
          window.addEventListener('devicemotion', handleMotion);
        } catch (_) {}
      }
    }

    let pointerActive = false;
    canvas.addEventListener('pointerdown', e => {
      pointerActive = true;
      const rect = canvas.getBoundingClientRect();
      rawTiltX = ((e.clientX - rect.left) / W) * 2 - 1;
    });
    canvas.addEventListener('pointermove', e => {
      if (!pointerActive) return;
      const rect = canvas.getBoundingClientRect();
      rawTiltX = ((e.clientX - rect.left) / W) * 2 - 1;
    });
    canvas.addEventListener('pointerup', () => { pointerActive = false; });
    canvas.addEventListener('pointercancel', () => { pointerActive = false; });

    function drawBackground() {
      if (!bgReady) {
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(0, 0, W, H);
        return;
      }

      const imgW = bgImg.naturalWidth;
      const imgH = bgImg.naturalHeight;
      const scale = Math.max(W / imgW, H / imgH);
      const drawW = imgW * scale;
      const drawH = imgH * scale;
      const ox = (W - drawW) / 2;
      const oy = (H - drawH) / 2;

      ctx.drawImage(bgImg, ox, oy, drawW, drawH);

      // Subtle top shade for UI readability
      const topShade = ctx.createLinearGradient(0, 0, 0, 90);
      topShade.addColorStop(0, 'rgba(0,0,0,0.35)');
      topShade.addColorStop(1, 'transparent');
      ctx.fillStyle = topShade;
      ctx.fillRect(0, 0, W, 90);
    }

    function drawCup(c) {
      const { x, y, w, h } = c;
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.88, w * 0.42, h * 0.1, 0, 0, Math.PI * 2);
      ctx.fill();

      const bodyGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
      bodyGrad.addColorStop(0, '#f0f0f0');
      bodyGrad.addColorStop(0.35, '#ffffff');
      bodyGrad.addColorStop(0.65, '#ffffff');
      bodyGrad.addColorStop(1, '#e8e8e8');
      ctx.fillStyle = bodyGrad;

      ctx.beginPath();
      ctx.moveTo(-w * 0.42, -h * 0.15);
      ctx.quadraticCurveTo(-w * 0.48, h * 0.5, -w * 0.35, h * 0.85);
      ctx.lineTo(w * 0.35, h * 0.85);
      ctx.quadraticCurveTo(w * 0.48, h * 0.5, w * 0.42, -h * 0.15);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#d0d0d0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w * 0.35, h * 0.85);
      ctx.lineTo(w * 0.35, h * 0.85);
      ctx.stroke();

      ctx.fillStyle = '#3d2314';
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.08, w * 0.36, h * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,200,140,0.15)';
      ctx.beginPath();
      ctx.ellipse(-w * 0.08, -h * 0.1, w * 0.12, h * 0.05, -0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.15, w * 0.4, h * 0.1, 0, Math.PI, 0);
      ctx.stroke();

      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.15, w * 0.42, h * 0.11, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#f5f5f5';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(w * 0.42, h * 0.25, h * 0.28, -0.85, 0.95);
      ctx.stroke();

      ctx.strokeStyle = '#d8d8d8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(w * 0.42, h * 0.25, h * 0.28, -0.85, 0.95);
      ctx.stroke();

      ctx.restore();
    }

    function drawDrip(d) {
      ctx.save();
      ctx.translate(d.x, d.y);

      const g = ctx.createRadialGradient(-d.r*0.3, -d.r*0.3, 0, 0, 0, d.r);
      g.addColorStop(0, '#8b5a3c');
      g.addColorStop(0.7, d.color);
      g.addColorStop(1, '#2a180f');
      ctx.fillStyle = g;

      ctx.beginPath();
      ctx.moveTo(0, -d.r * 1.3);
      ctx.bezierCurveTo(d.r * 0.9, -d.r * 0.4, d.r * 0.9, d.r * 0.6, 0, d.r);
      ctx.bezierCurveTo(-d.r * 0.9, d.r * 0.6, -d.r * 0.9, -d.r * 0.4, 0, -d.r * 1.3);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,220,180,0.35)';
      ctx.beginPath();
      ctx.ellipse(-d.r * 0.25, -d.r * 0.35, d.r * 0.25, d.r * 0.35, -0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function update(dt) {
      if (!running) return;

      // Smooth the incoming tilt (heavy low-pass)
      smoothTiltX += (rawTiltX - smoothTiltX) * Math.min(1, 6 * dt);
      tiltX = smoothTiltX;

      // Soft follow – lower spring constant + velocity damping = no shake
      cup.targetX = W / 2 + tiltX * (W * 0.40);
      const dx = cup.targetX - cup.x;
      cup.vx += dx * 12 * dt;          // acceleration toward target
      cup.vx *= Math.pow(0.15, dt);    // strong damping
      cup.x += cup.vx * dt;
      cup.x = Math.max(cup.w * 0.45, Math.min(W - cup.w * 0.45, cup.x));

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnDrip();
        // Small random variation around the level interval
        spawnTimer = spawnInterval * (0.85 + Math.random() * 0.3);
      }

      for (let i = drips.length - 1; i >= 0; i--) {
        const d = drips[i];
        d.vy += 380 * dt;
        d.x  += d.vx * dt;
        d.y  += d.vy * dt;

        const cupTop = cup.y - cup.h * 0.15;
        const cupLeft = cup.x - cup.w * 0.38;
        const cupRight = cup.x + cup.w * 0.38;

        if (d.y + d.r > cupTop && d.y - d.r < cup.y + cup.h * 0.2 &&
            d.x > cupLeft && d.x < cupRight && d.vy > 0) {
          score += 1;
          levelCaught += 1;
          scoreEl.textContent = score;
          spawnSplash(d.x, cupTop, d.color, 10);
          drips.splice(i, 1);

          // Level complete?
          if (levelCaught >= levelGoal) {
            level += 1;
            levelCaught = 0;
            levelGoal = 9 + level;          // 10, 11, 12, 13...
            // Speed up a little each level (never faster than 0.55s)
            spawnInterval = Math.max(0.55, 2.0 - (level - 1) * 0.18);
            levelEl.textContent = level;
            // Brief visual feedback – clear remaining drips so player gets a moment
            drips.length = 0;
            spawnTimer = spawnInterval * 0.8;
          }
          continue;
        }

        if (d.y - d.r > H) {
          lives -= 1;
          livesEl.textContent = lives;
          spawnSplash(d.x, H - 10, d.color, 12);
          drips.splice(i, 1);
          if (lives <= 0) gameOver();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += 500 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (Math.random() < 0.3) spawnSteam();
      for (let i = steam.length - 1; i >= 0; i--) {
        const s = steam[i];
        s.y += s.vy * dt;
        s.x += (Math.random() - 0.5) * 15 * dt;
        s.life -= dt;
        if (s.life <= 0) steam.splice(i, 1);
      }
    }

    function render() {
      drawBackground();

      for (const s of steam) {
        const alpha = (s.life / s.maxLife) * 0.35;
        ctx.fillStyle = `rgba(255,245,230,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (1.2 - s.life / s.maxLife), 0, Math.PI * 2);
        ctx.fill();
      }

      for (const d of drips) drawDrip(d);
      if (cup) drawCup(cup);

      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function loop(t) {
      const dt = Math.min(0.033, (t - lastTime) / 1000 || 0.016);
      lastTime = t;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function startGame() {
      score = 0;
      lives = 3;
      level = 1;
      levelCaught = 0;
      levelGoal = 10;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
      drips = [];
      particles = [];
      steam = [];
      spawnInterval = 2.0;   // Level 1: every ~2 seconds
      spawnTimer = 1.0;
      cup = createCup();
      tiltX = 0;
      rawTiltX = 0;
      smoothTiltX = 0;
      running = true;
      overlay.classList.add('hidden');
    }

    function gameOver() {
      running = false;
      overlay.querySelector('h1').textContent = 'Game Over';
      overlay.querySelector('p').innerHTML =
        `You reached <strong>Level ${level}</strong> and caught <strong>${score}</strong> drips.<br>Tilt again to try for a higher score!`;
      startBtn.textContent = 'Play Again';
      document.getElementById('permission-note').style.display = 'none';
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', async () => {
      if (!hasPermission) {
        await requestMotionPermission();
      }
      startGame();
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
